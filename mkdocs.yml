site_name: Agentic Engineering Handbook
site_description: The definitive OpenAI, Anthropic, Google, MCP, Harness, Evals, and Production Agent Systems learning roadmap.
site_author: keyuchen21

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: '📖 전체 핸드북 PDF 인쇄 / Print Book'
      add_print_site_banner: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - 📖 핸드북 메인 로드맵: index.md
  - 🏗️ 시스템 아키텍처: ARCHITECTURE.md
  - 📋 직무 역량 계획서: CAREER_PLAN.md
  - 🧠 지식 체계 문서: KNOWLEDGE_SYSTEM.md
  - 🛠️ Phase 0 - Agent Loop 튜토리얼:
      - Overview: tutorials/agent-loop/index.md
      - v0 - Bash is All You Need: tutorials/agent-loop/v0-bash-is-all-you-need.md
      - v1 - Model as Agent: tutorials/agent-loop/v1-model-as-agent.md
      - v2 - Structured Planning: tutorials/agent-loop/v2-structured-planning.md
      - v3 - Subagent Mechanism: tutorials/agent-loop/v3-subagent-mechanism.md
      - v4 - Skills Mechanism: tutorials/agent-loop/v4-skills-mechanism.md
  - ⚙️ 스킬 & 레퍼런스:
      - Agent Builder Skill: tutorials/agent-loop/skills/agent-builder/SKILL.md
      - Agent Philosophy: tutorials/agent-loop/skills/agent-builder/references/agent-philosophy.md
      - Code Review Skill: tutorials/agent-loop/skills/code-review/SKILL.md
      - MCP Builder Skill: tutorials/agent-loop/skills/mcp-builder/SKILL.md
      - PDF Handling Skill: tutorials/agent-loop/skills/pdf/SKILL.md
